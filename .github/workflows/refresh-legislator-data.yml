name: Refresh legislator data

# Committee seats change when the Legislature reorganises; sponsorship counts
# change constantly while in session. Monthly keeps both fresh without burning
# the Open States free-tier quota.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      committees_only:
        description: 'Skip the slow sponsorship pass'
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The per-minute rate limit means a full run takes ~30 min of mostly
    # sleeping. 60 leaves room for retries without hanging a whole hour.
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh from Open States
        env:
          OPEN_STATES_API_KEY: ${{ secrets.OPEN_STATES_API_KEY }}
        run: |
          python scripts/refresh_legislator_data.py \
            ${{ inputs.committees_only && '--committees-only' || '' }}

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/legislators.json; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislators.json
          git commit -m "Refresh legislator committees and sponsorship counts

          Automated monthly pull from the Open States v3 API."
          git push
