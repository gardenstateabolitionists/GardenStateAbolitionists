name: Refresh legislator data

# Committee seats change when the Legislature reorganizes. Monthly is plenty,
# and the whole run is three API calls.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Three requests, but the per-minute rate limit means retries can sleep
    # 65s at a time.
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh from Open States
        env:
          OPEN_STATES_API_KEY: ${{ secrets.OPEN_STATES_API_KEY }}
        run: python scripts/refresh_legislator_data.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/legislators.json; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislators.json
          git commit -m "Refresh legislator committee assignments

          Automated monthly pull from the Open States v3 API."
          git push
